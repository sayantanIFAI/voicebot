# Password-protected front door for the voice agent. A SEPARATE nginx instance from the pod's own template nginx
# (which proxies unrelated apps); this one lives entirely under /workspace so a restart never loses it.
# Port 8888 is the only HTTP port this pod exposes publicly (RunPod's proxy returns 404 for every other port).
daemon on;
worker_processes 1;
pid /tmp/voicebot-gw.pid;
error_log /workspace/logs/gateway_error.log warn;
events { worker_connections 1024; }
http {
    access_log /workspace/logs/gateway_access.log;
    client_body_temp_path /tmp/gw/body;
    proxy_temp_path /tmp/gw/proxy;
    fastcgi_temp_path /tmp/gw/fcgi;
    uwsgi_temp_path /tmp/gw/uwsgi;
    scgi_temp_path /tmp/gw/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    include /workspace/gateway/upstream.conf;   # defines: upstream voice_app { server 127.0.0.1:PORT; }
    server {
        listen 8888;
        auth_basic "Kolkata Care voice agent (test)";
        auth_basic_user_file /workspace/gateway/htpasswd;
        client_max_body_size 50m;
        location /twilio/ {
            auth_basic off;
            proxy_pass http://voice_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
        location / {
            # The page has no cache headers, so a browser kept a stale copy and never asked for the login again: its voice connection then arrived without credentials (401) and the page said
            # "connection problem" (2026-10-28). no-cache = always check with the server, which also makes the browser send the login.
            add_header Cache-Control "no-cache" always;
            proxy_pass http://voice_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
