# sourav, 2026-10-21: Twilio phone-call routes for the pod's nginx gateway.
# Why: the gateway puts the whole site behind HTTP basic auth, but Twilio's servers cannot send a password. These
# three paths are therefore exempt from basic auth; they protect themselves instead (Twilio request signature on
# /twilio/voice, a short-lived per-call token on /twilio/stream -- see agent/twilio_bridge.py).
# Install: paste this block inside the existing `server { ... }` of /workspace/gateway/nginx.conf, ABOVE the
# `location /` block, then `bash /workspace/gateway/gateway.sh pcm` (reloads nginx). It is not a complete config.
#
# X-Forwarded-Host/-Proto matter: Twilio signs the public URL, and the app only sees the internal address.
# If your nginx.conf does not already define `map $http_upgrade $connection_upgrade`, add this at http{} level:
#     map $http_upgrade $connection_upgrade { default upgrade; '' close; }

location /twilio/ {
    auth_basic off;
    proxy_pass http://voice_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
